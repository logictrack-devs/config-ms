
server:
  port: 8066

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8065/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,gateway

spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: security
              uri: lb://SECURITY-SERVICE
              predicates:
                - Path=/applications/apisecurity/**
              filters:
                - StripPrefix=2

            - id: shipment
              uri: lb://SHIPMENT-SERVICE
              predicates:
                - Path=/applications/apishipment/**
              filters:
                - StripPrefix=2

            - id: courier
              uri: lb://COURIER-SERVICE
              predicates:
                - Path=/applications/apicourier/**
              filters:
                - StripPrefix=2
